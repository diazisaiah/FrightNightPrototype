[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
(function () {
  // Fright Night (2026-11-04): Ctrl is a game key (Ctrl + click throws uppercuts, some
  // dodge schemes hold it), so Ctrl + a key must not save the page, bookmark it, select
  // all, print or reload. The game still gets every key.
  var ctrl = false;
  window.addEventListener('keydown', function (e) {
    ctrl = e.ctrlKey || e.metaKey;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key && e.key.length === 1) { e.preventDefault(); }
  }, true);
  window.addEventListener('keyup', function (e) { ctrl = e.ctrlKey || e.metaKey; }, true);
  window.addEventListener('blur', function () { ctrl = false; });
  // Ctrl + W can't be blocked in a window: if Ctrl is down as the page closes, the
  // browser asks first instead of losing the run.
  window.addEventListener('beforeunload', function (e) { if (ctrl) { e.preventDefault(); e.returnValue = ''; } });
  // In fullscreen, Chrome and Edge let the game keep every key (Ctrl + W too).
  document.addEventListener('fullscreenchange', function () {
    if (document.fullscreenElement && navigator.keyboard && navigator.keyboard.lock) { navigator.keyboard.lock(); }
  });
  // Ctrl + click is a right click on a Mac: no page menu over the game.
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

