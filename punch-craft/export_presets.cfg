exclude_filter="*.glb, fist.tscn, sketchfab_scene.tscn, fists_2025__*, sound_lab.*, art/*_voxel_model.png, art/*_detailed_v2.png, art/alternate_skins/*"
export_path="../builds/web/index.html"
